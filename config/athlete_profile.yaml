pace_target_mode: pace
pace_zones:
  note: 'Recalibrado em 2026-08-23 usando regressao pace/FC sobre 13 corridas desde
    o retorno (24/07 a 22/08), nao so uma atividade. Correcao importante: o Z2 real
    observado ficou mais LENTO do que a estimativa anterior (7.5-8.75) sugeria - nas
    duas unicas corridas em que a FC ficou de fato em Z2 (140-146 bpm), o pace foi
    8:11-8:46/km, nao 7:30-8:00/km. Valores em minutos por km (fracao decimal, ex:
    7.5 = 7:30/km). Atencao: aqui "min" e o pace mais RAPIDO (numero menor) e "max"
    o mais LENTO (numero maior) da zona - o inverso da logica de hr_zones. Recalibrar
    de novo apos o teste de 5 km previsto para ~27/09.'
  z1:
    min: 8.76
    max: 10.0
    purpose: recovery
  z2:
    min: 7.92
    max: 8.76
    purpose: easy_aerobic
  z3:
