training:
  plan_owner: external_coach_greg
  plan_owner_note: Os campos abaixo (days_per_week, periodization, progression) sao
    o ultimo plano que o garmin-trainer tinha montado antes de 2026-09-13 - contexto
    historico, nao usar para propor treinos novos. Quem define o plano atual e' o
    Greg.
  days_per_week: 4
  long_run_day: saturday
  intensity_distribution:
    easy_percent: 75
    quality_percent: 25
  current_focus:
  - cardiac_drift_control
  - aerobic_base_consolidation
  - threshold_introduction
  - race_pace_development
  progression:
    current_long_run_km: 6.5
    target_long_run_km: 10.5
    max_weekly_increase_percent: 10
  periodization:
  - phase: base_consolidation
    weeks: 2026-08-23 a 2026-09-05
    focus: Eliminar deriva cardiaca nas corridas leves antes de adicionar qualquer
      estimulo de velocidade. Pace estritamente em Z2 real (7:55-8:45/km), longao
      subindo de 6.5 para ~8 km.
  - phase: aerobic_to_threshold
    weeks: 2026-09-06 a 2026-09-19
    focus: Introduzir 1 treino de qualidade por semana (progressivo/tempo curto),
      longao subindo ate ~9-10 km. So avancar se a FC em Z2 estiver comportada.
  - phase: race_specific_and_checkpoint
    weeks: 2026-09-20 a 2026-10-03
    focus: Teste de 5 km em campo (~27/09) para recalibrar o tempo-alvo real da prova.
      Intervalados no pace de prova (6:00/km) e tempo runs no limiar.
  - phase: taper
    weeks: 2026-10-04 a 2026-10-13
    focus: Reducao de volume de 30-40%, manter toques curtos no pace de prova, descanso
      nos ultimos 2 dias antes da corrida.
