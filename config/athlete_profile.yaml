heart_rate:
  max_hr: 193
  max_hr_source: observed_garmin
  resting_hr: 55
  hr_zones:
    z1:
      min: 115
      max: 139
      purpose: recovery
    z2:
      min: 140
      max: 155
      purpose: easy_aerobic
    z3:
      min: 156
      max: 168
      purpose: moderate
    z4:
      min: 169
      max: 178
      purpose: threshold
    z5:
      min: 179
      max: 191
