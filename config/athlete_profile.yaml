training:
  plan_owner: garmin_trainer
  plan_owner_since: '2026-10-12'
  auto_publish: false
  auto_publish_note: Quando true, o tick gera e publica a semana seguinte todo domingo
    (ou no primeiro tick da semana se o domingo for perdido).
  days_per_week: 3
  long_run_day: saturday
  intensity_distribution:
    easy_percent: 80
    quality_percent: 20
  current_focus:
  - post_race_recovery
  - true_easy_aerobic_base
  - cardiac_drift_control
  - one_quality_session_per_week
  progression:
    current_long_run_km: 10
    max_weekly_increase_percent: 10
  key_rules:
  - 'Rodagens leves e longao guiados por FC (hr_range 140-155 bpm), NAO por pace:
    o historico mostra 73-96% do tempo em Z4/Z5 mesmo nas corridas ''tranquilas''
    quando guiadas por pace.'
  - No maximo 1 treino de qualidade por semana (limiar ou intervalado), guiado por
    pace, com aquecimento e desaquecimento.
  - 'Com 3 dias por semana: 1 rodagem leve, 1 qualidade, 1 longao leve.'
  periodization:
  - phase: post_race_recovery
    weeks: 2026-10-12 a 2026-10-18
    focus: Recuperar da prova (HRV 25 ms, sono 45 no dia seguinte). Apenas corridas
      curtas e muito leves por FC, sem qualidade.
  - phase: aerobic_base
    weeks: 2026-10-19 a 2026-11-15
    focus: 'Base aerobica real: rodagens e longao em 140-155 bpm mesmo que o pace
      fique 8:00-9:00/km. Qualidade leve: strides/progressivo curto.'
  - phase: threshold_development
    weeks: 2026-11-16 a 2026-12-06
    focus: 1 treino de limiar por semana (blocos em Z4 de pace), longao ate ~12 km
      leve.
  - phase: race_specific_and_taper
    weeks: 2026-12-07 a 2026-12-20
    focus: Ritmo de prova (~6:30/km) em blocos, polimento na ultima semana.
preferences:
  avoid_days: []
  preferred_training_days:
  - tuesday
  - thursday
  - saturday
  interval_preference: morning
  recovery:
    avoid_hills: true
  strength_training:
    recommended_days_per_week: 2
    goal: maintain_muscle_mass
notes:
- '2026-10-12: plano de treinos voltou a ser do garmin-trainer (fim do Greg/Garmin
  Coach), 3 dias/semana, publicacao automatica semanal. Proximo objetivo: outro 10
  km (~meados de dezembro), meta 1:05:00; meia maratona depois.'
- 'Mudanca de rota em 2026-09-13: o treinador Greg (Garmin Coach) passou a montar
  o plano de treinos do atleta. O garmin-trainer NAO gera nem publica treinos desde
  entao - so faz check-in diario (metricas do dia + analise do treino quando houver)
  via `cli.py daily`, chamado pelo pipeline agendado. Ver profile.external_coach.'
- 'Corrigida a data da prova em 2026-09-13: 10 km sub-60min agora e'' em 2026-10-11
  (nao 13/10 como registrado antes).'
- Atleta esta com 86 kg em 2026-09-13 e quer perder peso, sem meta numerica definida
  ainda. Acompanhar peso via wellness.weight_kg (sincronizado do Garmin) nos check-ins
  diarios e nas revisoes do personal trainer.
- Retornou de aproximadamente 30 dias sem correr em 24/07/2026; considerado adaptado
  ao retorno a partir de 2026-08-23 (4 semanas de treino consistente), pronto para
  progredir intensidade de forma controlada.
- 'Objetivo mudou em 2026-08-23: 10 km em 1h (13/10/2026) e agora a meta primaria;
  meia maratona vira meta secundaria/futura. Ver goal.primary.feasibility_note - meta
  agressiva, requer reavaliacao no teste de 5 km de ~27/09.'
- Adicionado 4o treino semanal (quinta-feira) em 2026-08-23 a pedido do atleta, necessario
  para ter chance real de sub-60 no 10 km.
- Corridas leves devem permanecer predominantemente em Z2 de pace (ver pace_zones
  recalibradas em 2026-08-23 - Z2 real e mais lento do que a estimativa inicial).
- Evitar transformar treinos leves em treinos progressivos, exceto nos treinos de
  qualidade explicitamente planejados na periodizacao (training.progression.periodization).
- Longao deve ser predominantemente leve, mesmo na fase de introducao de qualidade.
- Reavaliar pace_zones e hr_zones conforme novos dados do Garmin, e formalmente no
  checkpoint de 2026-09-27 (teste de 5 km).
- Atleta pediu para os treinos serem guiados por pace em vez de FC (2026-08-13).
- 'Historico recente (13 corridas entre 24/07 e 22/08) mostra deriva cardiaca constante
  em rodagens leves: FC media ficou em Z3 (156-166 bpm) na maioria das corridas mesmo
  com pace nominal de Z2, com excecao de 31/07 e 02/08 (unicas com FC efetivamente
  em Z2, e ambas mais lentas que 8:00/km). Corrigir isso e pre-requisito para introduzir
  qualquer treino de velocidade - ao usar pace como alvo, sempre mencionar na descricao
  do treino que, se a FC subir e permanecer acima da Z3, o atleta deve desacelerar
  mesmo abaixo do pace-alvo.'
