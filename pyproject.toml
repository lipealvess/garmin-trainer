[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-trainer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.2.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
garmin-trainer = "garmin_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
